<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CrusaderBlock</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0f1115;
      color: #f3f4f6;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      padding: 20px;
    }

    .card {
      width: 100%;
      max-width: 340px;
      background: #181c24;
      border: 1px solid #2b313e;
      border-radius: 14px;
      padding: 20px;
      text-align: center;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.45);
    }

    .card img {
      width: 100%;
      max-height: 280px;
      object-fit: contain;
      border-radius: 10px;
      margin-bottom: 16px;
      display: block;
    }

    h1 {
      font-size: 1.35rem;
      font-weight: 700;
      letter-spacing: 0.3px;
      margin-bottom: 16px;
      color: #ffffff;
    }

    button {
      width: 100%;
      padding: 10px 16px;
      border: none;
      border-radius: 8px;
      background: #8f2929;
      color: #ffffff;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s ease-in-out;
    }

    button:hover {
      background: #b94a3b;
    }
  </style>
</head>
<body>
  <div class="card">
    <img src="../assets/crusader-door.png" alt="Crusader Door" />
    <h1>You were protected.</h1>
    <button id="closeBtn" type="button">Close</button>
  </div>

  <script src="protected.js"></script>
</body>
</html>
